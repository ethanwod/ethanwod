name: Update language telemetry

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"
  push:
    branches: [main]
    paths-ignore:
      - "assets/language-stats.svg"

permissions:
  contents: write

concurrency:
  group: language-telemetry
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test generator
        run: node --test tests/generate-language-stats.test.mjs
      - name: Generate language telemetry
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROFILE_OWNER: ethanwod
        run: node scripts/generate-language-stats.mjs
      - name: Publish updated telemetry
        run: |
          if git diff --quiet -- assets/language-stats.svg; then
            echo "Language telemetry is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- assets/language-stats.svg
          git commit -m "chore: refresh language telemetry"
          git push

